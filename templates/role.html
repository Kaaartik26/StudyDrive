<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose Role • StudyDrive</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
    }

    .container {
      background: #1e293b;
      padding: 50px;
      border-radius: 24px;
      width: 360px;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin-bottom: 40px;
      color: #94a3b8;
      font-size: 14px;
    }

    .role-btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 15px 0;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      text-decoration: none;
      color: white;
    }

    .student {
      background: #10b981;
    }

    .student:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    .admin {
      background: #6366f1;
    }

    .admin:hover {
      background: #4f46e5;
      transform: translateY(-2px);
    }

    .hint {
      margin-top: 30px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>StudyDrive</h1>
    <p>Select how you want to continue</p>

    <!-- Student -->
    <a href="/student" class="role-btn student">
      🎓 Continue as Student
    </a>

    <!-- Admin -->
    <a href="/admin-login" class="role-btn admin">
      🔐 Continue as Admin
    </a>

    <div class="hint">
      Admin access is restricted
    </div>
  </div>

</body>
</html>
