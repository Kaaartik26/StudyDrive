<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 500px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 0 20px;
    }
    .role-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px 20px;
      border-radius: 20px;
      text-decoration: none;
      color: white;
      flex: 1;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .role-card:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border-color: #818cf8;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 15px;
      display: block;
    }
    .role-title {
      font-weight: 700;
      font-size: 1.2rem;
      display: block;
    }
    .role-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 5px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-cloud"></i> Study Drive</h1>
    <div class="card-row">
      <a href="/user" class="role-card">
        <span class="icon">🎓</span>
        <span class="role-title">Student</span>
        <span class="role-desc">Access materials</span>
      </a>
      <a href="/admin_login" class="role-card">
        <span class="icon">🔐</span>
        <span class="role-title">Admin</span>
        <span class="role-desc">Manage files</span>
      </a>
    </div>
  </div>
</body>
</html>
