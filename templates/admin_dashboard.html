<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --input-bg: #334155;
      --text: #f1f5f9;
      --primary: #6366f1;
      --danger: #ef4444;
      --success: #10b981;
    }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); padding: 30px; margin: 0; }
    h1, h2, h3 { margin: 0; font-weight: 600; }
    a { text-decoration: none; color: inherit; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .logout { color: #94a3b8; font-size: 0.9rem; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; transition: .2s; }
    .logout:hover { background: #334155; color: white; }

    /* Control Panel */
    .control-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .panel-box {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #334155;
    }
    .panel-box h2 { font-size: 1.1rem; margin-bottom: 15px; color: #94a3b8; }
    form { display: flex; gap: 10px; }
    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid #475569;
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }
    .btn-create { background: var(--success); color: white; }
    .btn-create:hover { background: #059669; }
    .btn-delete { background: var(--danger); color: white; }
    .btn-delete:hover { background: #dc2626; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-back { background: #334155; color: white; margin-bottom: 20px; }

    /* Folders */
    .section-title { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .folder-card {
      background: var(--card);
      border: 1px solid #334155;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }
    .folder-card:hover { transform: translateY(-5px); background: #2d3748; border-color: var(--primary); }
    .folder-icon { font-size: 40px; margin-bottom: 10px; display: block; color: #fbbf24; }
    
    /* Files */
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .file-card {
      background: var(--card);
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .file-info b { display: block; margin-bottom: 5px; color: #e2e8f0; }
    .file-meta { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
    .actions { display: flex; gap: 8px; }
    .actions button { font-size: 12px; padding: 6px 12px; flex: 1; }

    /* Upload Area */
    #uploadForm { background: #2d3748; padding: 15px; border-radius: 12px; margin-bottom: 20px; align-items: center; }

  </style>
</head>
<body>

  <div class="header">
    <h1>🚀 Admin Dashboard</h1>
    <a href="/logout" class="logout">Log Out</a>
  </div>

  <div class="control-panel">
    <div class="panel-box">
      <h2><i class="fas fa-folder-plus"></i> Create New Folder</h2>
      <form method="post" action="/create_folder">
        <input name="folder_name" placeholder="e.g. Physics 101">
        <button type="submit" class="btn-create">Create</button>
      </form>
    </div>
    <div class="panel-box">
      <h2><i class="fas fa-trash-alt"></i> Delete Folder</h2>
      <form method="post" action="/delete_folder">
        <input name="folder_name" placeholder="Folder Name">
        <button type="submit" class="btn-delete">Delete</button>
      </form>
    </div>
  </div>

  <div id="folderView">
    <div class="section-title">
      <h2>Manage Subjects</h2>
    </div>
    <div class="folder-grid">
      {% for f in folders %}
        <div class="folder-card" onclick="openFolder('{{f}}')">
          <span class="folder-icon"><i class="fas fa-folder"></i></span>
          <div>{{f}}</div>
        </div>
      {% endfor %}
      {% if not folders %}
        <p style="color:#94a3b8">No folders available.</p>
      {% endif %}
    </div>
  </div>

  <div id="fileView" style="display:none">
    <button class="btn-back" onclick="backToFolders()">⬅ Back to Folders</button>
    <h2 id="folderTitle" style="margin-bottom:20px; color:#a5b4fc;"></h2>
    
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="file">
      <button class="btn-create" type="submit">Upload File</button>
    </form>

    <h3 style="margin-bottom:15px">Files in this folder</h3>
    <div id="fileGrid" class="file-grid"></div>
  </div>

<script>
let currentFolder = null;

function openFolder(folder){
  currentFolder = folder;
  document.getElementById("folderTitle").innerText = "📂 " + folder;
  document.getElementById("folderView").style.display = "none";
  document.getElementById("fileView").style.display = "block";
  loadFiles();
}

function backToFolders(){
  document.getElementById("fileView").style.display = "none";
  document.getElementById("folderView").style.display = "block";
}

async function loadFiles(){
  let res = await fetch("/files/" + currentFolder);
  let data = await res.json();
  let grid = document.getElementById("fileGrid");
  grid.innerHTML = "";
  
  if(!data.files || data.files.length === 0){
    grid.innerHTML = "<p style='color:#94a3b8'>No files here.</p>";
    return;
  }
  
  data.files.forEach(f=>{
    let card = document.createElement("div");
    card.className="file-card";
    card.innerHTML = `
      <div class="file-info">
        <b>${f.original_filename}</b>
        <div class="file-meta">
          ${(f.size/1024).toFixed(1)} KB • ${new Date(f.timestamp).toLocaleDateString()}
        </div>
      </div>
      <div class="actions">
        <a href="/download/${f.folder}/${f.stored_filename}" style="flex:1">
          <button class="btn-primary" style="width:100%">Download</button>
        </a>
        <button class="btn-delete" onclick="deleteFile('${f.folder}','${f.stored_filename}')">
          Delete
        </button>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.getElementById("uploadForm").onsubmit = async (e)=>{
  e.preventDefault();
  let form = new FormData(e.target);
  let res = await fetch("/upload/" + currentFolder,{
    method:"POST",
    body:form
  });
  alert(await res.text());
  loadFiles();
};

async function deleteFile(folder, stored){
  if(!confirm("Delete this file?")) return;
  let res = await fetch("/delete_file",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      folder:folder,
      stored_filename:stored
    })
  });
  let data = await res.json();
  alert(data.message || data.error);
  loadFiles();
}
</script>
</body>
</html>
