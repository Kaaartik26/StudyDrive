<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      width: 320px;
      text-align: center;
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; color: #f8fafc; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-family: inherit;
      transition: 0.3s;
      outline: none;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: 0.3s;
    }
    button:hover { background: #4f46e5; transform: translateY(-2px); }
    .error { margin-top: 15px; color: #ef4444; font-size: 0.9rem; }
    .back-link { margin-top: 20px; display: block; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: white; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Admin Access</h2>
    <form method="post">
      <input type="password" name="password" placeholder="Enter admin password">
      <button type="submit">Unlock Dashboard</button>
    </form>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <a href="/role" class="back-link">← Back to Menu</a>
  </div>
</body>
</html>
