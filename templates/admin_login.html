<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login • StudyDrive</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 22px;
      width: 320px;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      outline: none;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: 0.2s;
    }
    button:hover {
      background: #4f46e5;
      transform: translateY(-2px);
    }
    .error {
      margin-top: 15px;
      color: #ef4444;
      font-size: 14px;
    }
    .back {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
    }
    .back:hover { color: white; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Admin Access</h2>

    <form method="POST" action="/admin-login">
      <input type="password" name="password" placeholder="Admin password" required>
      <button type="submit">Enter Dashboard</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <a href="/" class="back">← Back</a>
  </div>

</body>
</html>
